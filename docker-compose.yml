services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: revival-backend:local
    init: true
    restart: unless-stopped
    ports:
      - "${REVIVAL_PORT:-8080}:8080"
    environment:
      Database__Provider: ${REVIVAL_DATABASE_PROVIDER:-Sqlite}
      Database__SqlitePath: /data/revival.db
      Storage__AssetRoot: /data/assets
      Storage__BackupRoot: /data/backups
      Security__AdminBootstrapSecret: ${REVIVAL_ADMIN_BOOTSTRAP_SECRET:-}
      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING:-}
    volumes:
      - revival_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  revival_data:
